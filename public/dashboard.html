<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚚 준도시락 배송관리 - 기사</title>
  <link rel="stylesheet" href="/css/driver-app.css?v=20260505220000">
</head>
<body>

  <!-- 헤더 -->
  <div class="app-header" style="position:relative;">
    <button onclick="logout()" title="로그아웃" style="position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.18);color:#fff;border:1px solid rgba(255,255,255,0.35);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;z-index:5;">🚪 로그아웃</button>
    <div class="greeting">안녕하세요</div>
    <div class="name" id="headerName">로딩 중...</div>
    <div class="team" id="headerTeam">-</div>
    <div class="score-box">
      <div>
        <div class="score-label">이번달 점수</div>
        <div class="score-num" id="headerScore">0점</div>
      </div>
      <div style="text-align:right">
        <div class="score-label">예상 수당</div>
        <div style="font-size:18px;font-weight:700" id="headerReward">-</div>
      </div>
    </div>
  </div>

  <!-- 🏠 홈 탭 -->
  <div class="tab-content active" id="tab-home">
    <div class="empty-state" style="margin:30px 16px">로딩 중...</div>
  </div>

  <!-- 💰 판매 탭 -->
  <div class="tab-content" id="tab-sales">
    <div class="empty-state" style="margin:30px 16px">로딩 중...</div>
  </div>

  <!-- 📝 평가 탭 (리더만 보임) -->
  <div class="tab-content" id="tab-eval">
    <div class="empty-state" style="margin:30px 16px">로딩 중...</div>
  </div>

  <!-- 📊 내 점수 탭 -->
  <div class="tab-content" id="tab-score">
    <div class="empty-state" style="margin:30px 16px">로딩 중...</div>
  </div>

  <!-- 🚗 차량관리 탭 (모든 기사) -->
  <div class="tab-content" id="tab-vehicle">
    <div class="empty-state" style="margin:30px 16px">로딩 중...</div>
  </div>

  <!-- 👤 내 정보 탭 -->
  <div class="tab-content" id="tab-mypage">
    <div class="empty-state" style="margin:30px 16px">로딩 중...</div>
  </div>

  <!-- 하단 네비 (6개 탭) -->
  <div class="bottom-nav" style="grid-template-columns:repeat(6, 1fr)">
    <div class="nav-tab active" data-tab="home" onclick="showTab('home', this)">
      <span class="icon">🏠</span>
      <span>홈</span>
    </div>
    <div class="nav-tab" data-tab="sales" onclick="showTab('sales', this)">
      <span class="icon">💰</span>
      <span>판매</span>
    </div>
    <div class="nav-tab" data-tab="eval" onclick="showTab('eval', this)">
      <span class="icon">📝</span>
      <span>평가</span>
    </div>
    <div class="nav-tab" data-tab="score" onclick="showTab('score', this)">
      <span class="icon">📊</span>
      <span>점수</span>
    </div>
    <div class="nav-tab" data-tab="vehicle" onclick="showTab('vehicle', this)">
      <span class="icon">🚗</span>
      <span>차량</span>
    </div>
    <div class="nav-tab" data-tab="mypage" onclick="showTab('mypage', this)">
      <span class="icon">👤</span>
      <span>내정보</span>
    </div>
  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <script src="/js/firebase-config.js?v=20260505220000"></script>
  <script src="/js/auth.js?v=20260505220000"></script>
  <script src="/js/driver-app.js?v=20260505220000"></script>
</body>
</html>
