<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미주문 업체 분석 — 준도시락</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; background:#f0f4f1; color:#1a202c; padding-bottom:40px; }

  .header { background:linear-gradient(135deg,#1a4731 0%,#2d6a4f 100%); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .header-title { font-size:16px; font-weight:800; }
  .btn-back { background:none; border:none; color:#fff; font-size:13px; cursor:pointer; opacity:0.9; }

  .filter-bar { background:#fff; padding:12px 16px; border-bottom:1px solid #e2e8f0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .filter-bar select { padding:8px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; font-weight:600; color:#1a4731; background:#fff; cursor:pointer; }

  .card { background:#fff; border-radius:12px; padding:16px; margin:12px 14px; box-shadow:0 2px 8px rgba(26,71,49,0.07); }
  .card-title { font-size:15px; font-weight:800; color:#1a4731; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
  .card-sub { font-size:11px; color:#718096; font-weight:400; margin-left:auto; }

  .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .summary-card { background:#f7fafc; border-radius:10px; padding:14px; text-align:center; }
  .summary-val { font-size:22px; font-weight:800; color:#1a4731; }
  .summary-label { font-size:11px; color:#718096; margin-top:4px; }

  .reason-chart { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .reason-row { display:flex; align-items:center; gap:10px; font-size:12px; }
  .reason-label { width:90px; font-weight:700; color:#2d3748; }
  .reason-bar-wrap { flex:1; background:#f0f4f1; border-radius:6px; height:18px; overflow:hidden; position:relative; }
  .reason-bar { height:100%; border-radius:6px; }
  .reason-count { font-weight:700; color:#4a5568; min-width:50px; text-align:right; }

  .tbl { width:100%; border-collapse:collapse; font-size:12px; }
  .tbl th { background:#f0f4f1; padding:8px 6px; text-align:center; color:#4a5568; font-weight:700; border-bottom:2px solid #e2e8f0; font-size:11px; }
  .tbl td { padding:7px 6px; text-align:center; border-bottom:1px solid #e2e8f0; }
  .tbl tbody tr:hover { background:#f7fafc; }
  .tbl td:first-child, .tbl th:first-child { text-align:left; }

  .badge { display:inline-block; padding:2px 7px; border-radius:10px; font-size:10px; font-weight:700; }
  .b-urgent { background:#fed7d7; color:#c53030; }
  .b-check { background:#fef3c7; color:#92400e; }
  .b-resolved { background:#d1fae5; color:#065f46; }
  .b-pending { background:#f3f4f6; color:#4a5568; }

  .empty-msg { text-align:center; color:#a0aec0; padding:24px; font-size:13px; }
  .loading-msg { text-align:center; color:#718096; padding:24px; font-size:13px; }

  .reason-color-regular_off { background:#3182ce; }
  .reason-color-dinner { background:#38a169; }
  .reason-color-complaint { background:#d97706; }
  .reason-color-terminated { background:#c53030; }
  .reason-color-other { background:#718096; }
  .reason-color-custom { background:#9333ea; }

  .scroll-x { overflow-x:auto; }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="btn-back" onclick="location.href='/admin.html'">← 뒤로</button>
    <div class="header-title">📉 미주문 업체 분석</div>
  </div>
</div>

<div class="filter-bar">
  <label style="font-size:12px;color:#4a5568;font-weight:700;">기준 월</label>
  <select id="filter-month" onchange="loadAll()"></select>
  <label style="font-size:12px;color:#4a5568;font-weight:700;">팀</label>
  <select id="filter-team" onchange="loadAll()">
    <option value="">전체 팀</option>
    <option value="team1">1팀 준고</option>
    <option value="team2">2팀 해운대</option>
    <option value="team3">3팀 공오일</option>
    <option value="team4">4팀 연수남</option>
    <option value="team5">5팀 아가리</option>
    <option value="team6">6팀 도세마</option>
    <option value="team7">7팀 강서영</option>
  </select>
</div>

<!-- ① 월간 요약 -->
<div class="card">
  <div class="card-title">📊 월간 요약 <span class="card-sub" id="summary-period"></span></div>
  <div class="summary-grid" id="summary-cards"></div>
  <div id="summary-reason" class="reason-chart"></div>
</div>

<!-- ② 기사별 대응 현황 -->
<div class="card">
  <div class="card-title">👤 기사별 대응 현황 <span class="card-sub">담당 경보 수 / 처리 현황</span></div>
  <div class="scroll-x">
    <table class="tbl" id="driver-table">
      <thead>
        <tr>
          <th>기사</th><th>팀</th><th>전체</th><th>처리완료</th><th>처리율</th><th>미처리</th>
        </tr>
      </thead>
      <tbody id="driver-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ③ 거래종료 처리 업체 -->
<div class="card">
  <div class="card-title">🔴 거래종료 처리 업체 <span class="card-sub">이탈 확정</span></div>
  <div class="scroll-x">
    <table class="tbl" id="terminated-table">
      <thead>
        <tr>
          <th>처리일</th><th>업체명</th><th>팀</th><th>일평균</th><th>사유</th>
        </tr>
      </thead>
      <tbody id="terminated-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ④ 반복 문제 업체 -->
<div class="card">
  <div class="card-title">⚠️ 반복 경보 업체 <span class="card-sub">이번달 2회 이상 경보 발생</span></div>
  <div id="repeat-content"><div class="empty-msg">로딩 중...</div></div>
</div>

<!-- ⑤ 미처리 경보 -->
<div class="card">
  <div class="card-title">⏳ 미처리 경보 <span class="card-sub">기사 확인보고 필요</span></div>
  <div class="scroll-x">
    <table class="tbl" id="pending-table">
      <thead>
        <tr>
          <th>등급</th><th>업체</th><th>팀</th><th>경보일</th><th>연속</th><th>일평균</th>
        </tr>
      </thead>
      <tbody id="pending-tbody"></tbody>
    </table>
  </div>
</div>

<script>
const TEAM_NAMES = {
  team1:'1팀 준고', team2:'2팀 해운대', team3:'3팀 공오일',
  team4:'4팀 연수남', team5:'5팀 아가리', team6:'6팀 도세마', team7:'7팀 강서영'
};
const COURSE_DRIVER = {
  '코스1':'표창훈','코스2':'이근일','코스3':'김민기','코스4':'오철석',
  '코스5':'이진우','코스6':'박인수','코스7':'안준수','코스8':'최용혁',
  '코스9':'유상하','코스10':'금정','코스11':'이호주','코스12':'김창연',
  '코스13':'이창목','코스14':'김동완','코스15':'전태영','코스16':'김종호',
  '코스17':'류대현','코스18':'최준은','코스19':'조홍철'
};

// db는 firebase-config.js에서 이미 선언됨
let _reasons = {}; // key → {label, color, autoAction}

// 권한 확인
(() => {
  const stored = localStorage.getItem('jundosirak_user');
  if (!stored) { alert('로그인이 필요합니다.'); location.href = '/index.html'; return; }
  const me = JSON.parse(stored);
  if (me.role !== 'admin' && me.role !== 'manager') {
    alert('관리자 전용 페이지입니다.'); history.back(); return;
  }
})();

function initMonthSelector() {
  const sel = document.getElementById('filter-month');
  const now = new Date();
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const opt = document.createElement('option');
    opt.value = ym;
    opt.textContent = ym.replace('-','년 ') + '월';
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  }
}

async function loadReasonMap() {
  try {
    const snap = await db.collection('alert_reasons').get();
    _reasons = {};
    snap.forEach(d => { _reasons[d.id] = d.data(); });
  } catch(e) { console.warn('reason 로드 실패:', e); }
}

async function loadAll() {
  await loadReasonMap();
  const ym = document.getElementById('filter-month').value;
  const teamFilter = document.getElementById('filter-team').value;
  document.getElementById('summary-period').textContent = ym.replace('-','년 ') + '월';

  const start = `${ym}-01`;
  const [y, m] = ym.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const end = `${ym}-${String(lastDay).padStart(2,'0')}`;

  // alerts 조회 (date 기준)
  let alerts = [];
  try {
    const snap = await db.collection('alerts')
      .where('date','>=',start).where('date','<=',end).get();
    snap.forEach(d => alerts.push({ id: d.id, ...d.data() }));
  } catch(e) {
    // date 없는 구 문서 대응: 전체 조회 후 필터
    const all = await db.collection('alerts').get();
    all.forEach(d => {
      const a = { id: d.id, ...d.data() };
      const dt = a.date || (a.createdAt && a.createdAt.toDate ? a.createdAt.toDate().toISOString().slice(0,10) : '');
      if (dt >= start && dt <= end) alerts.push(a);
    });
  }
  if (teamFilter) alerts = alerts.filter(a => a.teamId === teamFilter);

  renderSummary(alerts);
  renderDriverTable(alerts);
  renderTerminated(alerts);
  renderRepeat(alerts);
  renderPending(alerts);
}

function renderSummary(alerts) {
  const total = alerts.length;
  const resolved = alerts.filter(a => a.resolved).length;
  const pending = total - resolved;
  const resolveRate = total ? Math.round(resolved / total * 100) : 0;

  const urgent = alerts.filter(a => a.grade === 'urgent').length;
  const check = alerts.filter(a => a.grade === 'check').length;

  document.getElementById('summary-cards').innerHTML = `
    <div class="summary-card">
      <div class="summary-val" style="color:#1a4731;">${total}</div>
      <div class="summary-label">전체 경보</div>
    </div>
    <div class="summary-card">
      <div class="summary-val" style="color:#276749;">${resolved} <span style="font-size:13px;color:#718096;font-weight:700;">(${resolveRate}%)</span></div>
      <div class="summary-label">처리 완료</div>
    </div>
    <div class="summary-card">
      <div class="summary-val" style="color:#c53030;">${pending}</div>
      <div class="summary-label">미처리</div>
    </div>
  `;

  // 사유 분포 (처리 완료 경보만)
  const resolvedAlerts = alerts.filter(a => a.resolved);
  const byReason = {};
  resolvedAlerts.forEach(a => {
    const key = a.resolveReasonKey || 'unclassified';
    if (!byReason[key]) byReason[key] = { count: 0, label: a.resolveReasonLabel || '(사유 없음)' };
    byReason[key].count++;
  });
  const reasonArr = Object.entries(byReason).map(([k,v]) => ({ key:k, ...v })).sort((a,b)=>b.count-a.count);
  const maxCount = Math.max(1, ...reasonArr.map(r=>r.count));

  const reasonHTML = reasonArr.length === 0
    ? '<div class="empty-msg" style="padding:10px;">사유 분류된 경보 없음</div>'
    : `<div style="font-size:12px;font-weight:700;color:#4a5568;margin-top:14px;margin-bottom:6px;">처리 사유 분포</div>` +
      reasonArr.map(r => {
        const pct = (r.count / maxCount * 100).toFixed(0);
        const colorClass = r.key.startsWith('custom_') ? 'reason-color-custom' : `reason-color-${r.key}`;
        return `
          <div class="reason-row">
            <span class="reason-label">${r.label}</span>
            <div class="reason-bar-wrap">
              <div class="reason-bar ${colorClass}" style="width:${pct}%;"></div>
            </div>
            <span class="reason-count">${r.count}건</span>
          </div>
        `;
      }).join('');
  document.getElementById('summary-reason').innerHTML = reasonHTML;
}

function renderDriverTable(alerts) {
  const byDriver = {};
  alerts.forEach(a => {
    const driver = COURSE_DRIVER[a.courseId] || '미배정';
    if (!byDriver[driver]) byDriver[driver] = { total: 0, resolved: 0, teamId: a.teamId };
    byDriver[driver].total++;
    if (a.resolved) byDriver[driver].resolved++;
  });

  const rows = Object.entries(byDriver)
    .map(([name, v]) => ({ name, ...v, rate: v.total ? Math.round(v.resolved/v.total*100) : 0, pending: v.total - v.resolved }))
    .sort((a,b) => b.total - a.total);

  const tbody = document.getElementById('driver-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">경보 없음</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const rateColor = r.rate >= 80 ? '#276749' : r.rate >= 50 ? '#d97706' : '#c53030';
    return `<tr>
      <td style="font-weight:600;">${r.name}</td>
      <td>${TEAM_NAMES[r.teamId] || r.teamId || '-'}</td>
      <td>${r.total}</td>
      <td style="color:#276749;font-weight:700;">${r.resolved}</td>
      <td style="color:${rateColor};font-weight:700;">${r.rate}%</td>
      <td style="color:#c53030;font-weight:700;">${r.pending}</td>
    </tr>`;
  }).join('');
}

function renderTerminated(alerts) {
  const terminated = alerts.filter(a => a.resolveReasonKey === 'terminated');
  const tbody = document.getElementById('terminated-tbody');
  if (!terminated.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">거래종료 처리된 업체 없음 ✅</td></tr>';
    return;
  }
  terminated.sort((a,b) => {
    const da = a.resolvedAt?.toDate?.()?.getTime() || 0;
    const db = b.resolvedAt?.toDate?.()?.getTime() || 0;
    return db - da;
  });
  tbody.innerHTML = terminated.map(a => {
    const resolvedDate = a.resolvedAt?.toDate?.();
    const dt = resolvedDate ? `${resolvedDate.getMonth()+1}/${resolvedDate.getDate()}` : '-';
    return `<tr>
      <td>${dt}</td>
      <td style="font-weight:700;color:#c53030;">${a.name || a.clientName}</td>
      <td>${TEAM_NAMES[a.teamId] || a.teamId || '-'}</td>
      <td>${a.dailyAvg || 0}개</td>
      <td style="font-size:11px;color:#718096;">${a.resolveCustomText || '-'}</td>
    </tr>`;
  }).join('');
}

function renderRepeat(alerts) {
  const byClient = {};
  alerts.forEach(a => {
    const name = a.name || a.clientName;
    if (!name) return;
    if (!byClient[name]) byClient[name] = { count: 0, teamId: a.teamId, reasons: [], dailyAvg: a.dailyAvg || 0 };
    byClient[name].count++;
    if (a.resolveReasonLabel) byClient[name].reasons.push(a.resolveReasonLabel);
  });

  const repeats = Object.entries(byClient)
    .filter(([_, v]) => v.count >= 2)
    .map(([name, v]) => ({ name, ...v }))
    .sort((a,b) => b.count - a.count);

  const container = document.getElementById('repeat-content');
  if (!repeats.length) {
    container.innerHTML = '<div class="empty-msg">반복 경보 업체 없음 ✅</div>';
    return;
  }
  container.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${repeats.map(r => {
        const reasonCounts = {};
        r.reasons.forEach(x => reasonCounts[x] = (reasonCounts[x]||0)+1);
        const reasonText = Object.entries(reasonCounts).map(([k,v]) => `${k} ${v}회`).join(' / ') || '사유 미입력';
        const bg = r.count >= 3 ? '#fff5f5' : '#fffaf0';
        const border = r.count >= 3 ? '#feb2b2' : '#fed7aa';
        return `
          <div style="background:${bg};border-left:3px solid ${border};border-radius:8px;padding:10px 12px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-weight:700;font-size:13px;">${r.name}</span>
              <span class="badge" style="background:${border};color:#fff;">${r.count}회</span>
              <span style="font-size:11px;color:#718096;">${TEAM_NAMES[r.teamId] || '-'}</span>
              <span style="font-size:11px;color:#718096;">· 일평균 ${r.dailyAvg}개</span>
            </div>
            <div style="font-size:11px;color:#4a5568;margin-top:4px;">📋 ${reasonText}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderPending(alerts) {
  const pending = alerts.filter(a => !a.resolved);
  pending.sort((a,b) => (b.consecutiveDays||0) - (a.consecutiveDays||0));
  const tbody = document.getElementById('pending-tbody');
  if (!pending.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">미처리 경보 없음 ✅</td></tr>';
    return;
  }
  tbody.innerHTML = pending.map(a => {
    const grade = a.grade === 'urgent' ? '<span class="badge b-urgent">🔴 즉시</span>' :
                  a.grade === 'check' ? '<span class="badge b-check">🟠 확인보고</span>' : '<span class="badge b-pending">-</span>';
    return `<tr>
      <td>${grade}</td>
      <td style="font-weight:600;">${a.name || a.clientName || '-'}</td>
      <td>${TEAM_NAMES[a.teamId] || a.teamId || '-'}</td>
      <td style="font-size:11px;color:#718096;">${a.date || '-'}</td>
      <td style="font-weight:700;color:#c53030;">${a.consecutiveDays || 0}일</td>
      <td>${a.dailyAvg || 0}개</td>
    </tr>`;
  }).join('');
}

// 초기화
initMonthSelector();
loadAll();
</script>

</body>
</html>
