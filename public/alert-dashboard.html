<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>경보 현황 대시보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
  .top-bar { background: #1a4731; color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .top-bar h1 { font-size: 17px; font-weight: 800; }
  .back-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .tab-bar { display: flex; background: #fff; border-bottom: 2px solid #e2e8f0; position: sticky; top: 49px; z-index: 99; }
  .tab-btn { flex: 1; padding: 12px 0; font-size: 13px; font-weight: 700; border: none; background: none; cursor: pointer; color: #718096; border-bottom: 3px solid transparent; }
  .tab-btn.active { color: #1a4731; border-bottom-color: #1a4731; }
  .content { padding: 14px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .card-title { font-size: 14px; font-weight: 800; color: #1a4731; margin-bottom: 12px; }
  .kpi-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border-radius: 12px; padding: 14px 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .kpi-val { font-size: 24px; font-weight: 900; }
  .kpi-label { font-size: 11px; color: #718096; margin-top: 3px; }
  .kpi.urgent .kpi-val { color: #c53030; }
  .kpi.watch .kpi-val { color: #c05621; }
  .kpi.check .kpi-val { color: #b7791f; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .filter-row select, .filter-row input { padding: 7px 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; background: #fff; }
  .filter-row label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #4a5568; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f7fafc; padding: 8px 10px; text-align: left; font-weight: 700; color: #2d3748; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #f0f4f8; vertical-align: middle; }
  tr:hover td { background: #f7fafc; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge-urgent { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
  .badge-watch  { background: #fffaf0; color: #c05621; border: 1px solid #fbd38d; }
  .badge-check  { background: #fefcbf; color: #b7791f; border: 1px solid #f6e05e; }
  .badge-ok     { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
  .badge-resolved { background: #f7fafc; color: #718096; border: 1px solid #e2e8f0; }
  .sms-success { color: #276749; font-weight: 700; }
  .sms-fail    { color: #c53030; font-weight: 700; }
  .empty { text-align: center; color: #718096; padding: 30px; font-size: 13px; }
  .refresh-btn { background: #edf2f7; border: none; border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; color: #4a5568; }
  .nav-bar { display: flex; justify-content: space-around; background: #fff; border-top: 1px solid #e2e8f0; padding: 10px 0 env(safe-area-inset-bottom); position: fixed; bottom: 0; width: 100%; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #718096; cursor: pointer; padding: 4px 8px; text-decoration: none; }
  .nav-item.active { color: #1a4731; }
  .nav-icon { font-size: 20px; margin-bottom: 2px; }
  .main-content { padding-bottom: 80px; }
  .log-item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .log-to { font-weight: 700; font-size: 13px; }
  .log-date { font-size: 11px; color: #718096; }
  .log-text { font-size: 12px; color: #4a5568; background: #f7fafc; border-radius: 6px; padding: 8px; white-space: pre-wrap; line-height: 1.5; margin-top: 6px; }
  .log-meta { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .log-tag { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: #e2e8f0; color: #4a5568; }
</style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="location.href='admin.html'">← 관리자</button>
  <h1>🚨 경보 현황 대시보드</h1>
  <button class="refresh-btn" onclick="loadAll()" style="background:rgba(255,255,255,0.15);color:#fff;">🔄</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tabBtn1" onclick="switchTab('alert')">🚨 경보 현황</button>
  <button class="tab-btn" id="tabBtn2" onclick="switchTab('sms')">📱 문자 이력</button>
</div>

<div class="main-content">
  <!-- 경보 현황 탭 -->
  <div id="tab-alert" class="content">
    <div class="kpi-row">
      <div class="kpi urgent"><div class="kpi-val" id="cnt-urgent">-</div><div class="kpi-label">🔴 즉시경보</div></div>
      <div class="kpi watch"><div class="kpi-val" id="cnt-watch">-</div><div class="kpi-label">🟡 주시</div></div>
      <div class="kpi check"><div class="kpi-val" id="cnt-check">-</div><div class="kpi-label">🟠 확인보고</div></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="card-title" style="margin:0;">경보 목록</div>
      </div>
      <div class="filter-row">
        <select id="f-grade" onchange="renderAlerts()">
          <option value="">전체 등급</option>
          <option value="urgent">🔴 즉시경보</option>
          <option value="watch">🟡 주시</option>
          <option value="check">🟠 확인보고</option>
        </select>
        <select id="f-team" onchange="renderAlerts()">
          <option value="">전체 팀</option>
        </select>
        <label><input type="checkbox" id="f-resolved" onchange="renderAlerts()"> 해제 포함</label>
      </div>
      <div style="overflow-x:auto;"><table>
        <thead><tr>
          <th>등급</th><th>거래처</th><th>연속일</th><th>발생일</th><th>팀</th><th>일평균</th><th>상태</th>
        </tr></thead>
        <tbody id="alert-tbody"><tr><td colspan="7" class="empty">불러오는 중...</td></tr></tbody>
      </table></div>
    </div>
  </div>

  <!-- 문자 이력 탭 -->
  <div id="tab-sms" class="content" style="display:none;">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="card-title" style="margin:0;">문자 발송 이력</div>
        <span id="sms-total" style="font-size:12px;color:#718096;"></span>
      </div>
      <div class="filter-row">
        <select id="sf-type" onchange="renderSms()">
          <option value="">전체 유형</option>
          <option value="alert">경보 문자</option>
          <option value="new_client">신규업체 문자</option>
          <option value="manual">수동 발송</option>
          <option value="field_visit_daily_summary">현장방문 요약</option>
        </select>
        <select id="sf-success" onchange="renderSms()">
          <option value="">전체</option>
          <option value="true">성공</option>
          <option value="false">실패</option>
        </select>
      </div>
      <div id="sms-list"><div class="empty">불러오는 중...</div></div>
    </div>
  </div>
</div>

<nav class="nav-bar">
  <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
  <a href="admin.html" class="nav-item"><span class="nav-icon">⚙️</span>관리자</a>
  <a href="alert-dashboard.html" class="nav-item active"><span class="nav-icon">🚨</span>경보</a>
  <a href="evaluation.html" class="nav-item"><span class="nav-icon">📊</span>평가</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script>

// 로그인 체크
const me = JSON.parse(localStorage.getItem('jundosirak_user') || localStorage.getItem('jd_user') || 'null');
if (!me || me.role !== 'admin') location.href = 'index.html';

let _alerts = [], _smsLogs = [];

const TEAM_NAMES = {
  'team1':'1팀 준고','team2':'2팀 해운대','team3':'3팀 공오일',
  'team4':'4팀 연수남','team5':'5팀 아가리','team6':'6팀 도세마','team7':'7팀 강서영'
};

function switchTab(t) {
  ['alert','sms'].forEach(id => {
    document.getElementById('tab-'+id).style.display = id===t ? '' : 'none';
    document.getElementById('tabBtn'+(id==='alert'?1:2)).classList.toggle('active', id===t);
  });
}

async function loadAll() {
  await Promise.all([loadAlerts(), loadSmsLogs()]);
}

async function loadAlerts() {
  const tbody = document.getElementById('alert-tbody');
  tbody.innerHTML = '<tr><td colspan="7" class="empty">불러오는 중...</td></tr>';
  try {
    const snap = await db.collection('alerts').orderBy('createdAt','desc').limit(200).get();
    _alerts = [];
    snap.forEach(d => _alerts.push({ id: d.id, ...d.data() }));
    
    // 팀 필터 옵션
    const teams = [...new Set(_alerts.map(a => a.teamId).filter(Boolean))];
    const teamSel = document.getElementById('f-team');
    const curTeam = teamSel.value;
    teamSel.innerHTML = '<option value="">전체 팀</option>' + 
      teams.map(t => `<option value="${t}" ${t===curTeam?'selected':''}>${TEAM_NAMES[t]||t}</option>`).join('');

    renderAlerts();
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty">오류: ${e.message}</td></tr>`;
  }
}

function renderAlerts() {
  const grade = document.getElementById('f-grade').value;
  const team  = document.getElementById('f-team').value;
  const showResolved = document.getElementById('f-resolved').checked;

  let list = _alerts.filter(a => {
    if (!showResolved && a.resolved) return false;
    if (grade && a.grade !== grade) return false;
    if (team && a.teamId !== team) return false;
    return true;
  });

  // KPI
  const active = _alerts.filter(a => !a.resolved);
  document.getElementById('cnt-urgent').textContent = active.filter(a=>a.grade==='urgent').length;
  document.getElementById('cnt-watch').textContent  = active.filter(a=>a.grade==='watch').length;
  document.getElementById('cnt-check').textContent  = active.filter(a=>a.grade==='check').length;

  const tbody = document.getElementById('alert-tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">경보 없음</td></tr>';
    return;
  }

  const GRADE = {
    urgent: '<span class="badge badge-urgent">🔴 즉시경보</span>',
    watch:  '<span class="badge badge-watch">🟡 주시</span>',
    check:  '<span class="badge badge-check">🟠 확인보고</span>',
  };

  tbody.innerHTML = list.map(a => {
    const gradeStr = GRADE[a.grade] || a.grade || '-';
    const dateStr = a.date || (a.createdAt?.toDate ? a.createdAt.toDate().toISOString().slice(0,10) : '-');
    const teamStr = TEAM_NAMES[a.teamId] || a.teamId || '-';
    const statusStr = a.resolved
      ? '<span class="badge badge-resolved">해제</span>'
      : '<span class="badge badge-ok">활성</span>';
    return `<tr>
      <td>${gradeStr}</td>
      <td style="font-weight:600;">${a.name||a.clientName||'-'}</td>
      <td style="text-align:center;">${a.consecutiveDays||1}일</td>
      <td>${dateStr}</td>
      <td>${teamStr}</td>
      <td style="text-align:center;">${a.dailyAvg||'-'}</td>
      <td>${statusStr}</td>
    </tr>`;
  }).join('');
}

async function loadSmsLogs() {
  const listEl = document.getElementById('sms-list');
  listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    const snap = await db.collection('sms_logs').orderBy('createdAt','desc').limit(100).get();
    _smsLogs = [];
    snap.forEach(d => _smsLogs.push({ id: d.id, ...d.data() }));
    document.getElementById('sms-total').textContent = `총 ${_smsLogs.length}건`;
    renderSms();
  } catch(e) {
    listEl.innerHTML = `<div class="empty">오류: ${e.message}</div>`;
  }
}

function renderSms() {
  const type    = document.getElementById('sf-type').value;
  const success = document.getElementById('sf-success').value;

  let list = _smsLogs.filter(s => {
    if (type && s.type !== type) return false;
    if (success === 'true'  && !s.success) return false;
    if (success === 'false' && s.success)  return false;
    return true;
  });

  const listEl = document.getElementById('sms-list');
  if (!list.length) {
    listEl.innerHTML = '<div class="empty">이력 없음</div>';
    return;
  }

  const TYPE_LABEL = {
    alert: '🚨 경보', new_client: '🆕 신규업체',
    manual: '✍️ 수동', field_visit_daily_summary: '🗺️ 현장방문'
  };

  listEl.innerHTML = list.map(s => {
    const dateStr = s.date || (s.createdAt?.toDate ? s.createdAt.toDate().toISOString().slice(0,16).replace('T',' ') : '-');
    const typeLabel = TYPE_LABEL[s.type] || s.type || '-';
    const successStr = s.success === true
      ? '<span class="sms-success">✅ 성공</span>'
      : s.success === false
        ? '<span class="sms-fail">❌ 실패</span>'
        : '<span style="color:#718096;">-</span>';
    const phone = s.to || '-';
    const toName = s.toName || '';
    return `<div class="log-item">
      <div class="log-header">
        <div class="log-to">${toName ? toName+' ' : ''}${phone !== '-' ? '('+phone+')' : ''}</div>
        <div>${successStr}</div>
      </div>
      <div class="log-meta">
        <span class="log-tag">${typeLabel}</span>
        <span class="log-tag">${dateStr}</span>
        ${s.alertCount !== undefined ? `<span class="log-tag">경보 ${s.alertCount}건 (즉시 ${s.urgentCount||0}건)</span>` : ''}
      </div>
      ${s.text ? `<div class="log-text">${s.text}</div>` : ''}
    </div>`;
  }).join('');
}

loadAll();
</script>
</body>
</html>
